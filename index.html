 frog, Pip, dull-colored and nervous, watched her sit boldly in the open.\n\n\"You just sit there in plain sight,\" said Pip. \"Bright as a flower, out where everything can see you, not hiding at all. How are you not terrified? Everything will eat you.\"\n\n\"Nothing will eat me,\" said Dart. \"And my color is the reason. It is a warning.\"\n\nDart's skin held a poison so potent that any predator foolish enough to eat her would deeply regret it — and her brilliant colors advertised exactly that. Every hunter in the forest knew, by instinct or by hard experience, that bright frogs like Dart meant poison, meant *do not touch*. So she sat in the open, unafraid, blazing with color, and nothing came near her.\n\n\"The dull frogs hide,\" said Dart, \"because they must — they have no defense but to not be seen. But I have a real defense, and so I wear a bright sign announcing it. My color says: I am dangerous, and you know it. Hunters do not test me. They see the warning and leave me be. I do not need to hide, because I have made myself impossible to mistake.\"\n\nPip looked at Dart, sitting fearless and radiant in the open, and understood that her boldness was not recklessness — it was the confidence of something that had a real defense and advertised it honestly.\n\nIf you have a genuine strength or defense, there is no shame in showing it openly. An honest warning can protect you better than hiding ever could.\n\nGoodnight, poison dart frogs. 🌙", "nile_crocodile": "Nile waited at the crossing for the great herd, and the waiting was the whole hunt.\n\nHe was a Nile crocodile, and once a year the wildebeest herds crossed his river in their thousands. Nile had been submerged at the crossing for days, barely moving, only his eyes above the brown water. A young crocodile, Pip, was baffled by the stillness.\n\n\"You just float there for days,\" said Pip. \"Not moving. How do you have the patience? I'd have gone mad and swum off to hunt fish.\"\n\n\"Because the herd is coming,\" said Nile, \"and this is where they must cross. Not today, maybe. But soon. And when thousands of them are churning across this water, I will be right here, in the middle of it, and I will not have to chase a single one. The whole feast comes to me — I only have to be patient enough to still be here when it does.\"\n\nPip could not manage it — kept swimming off, kept snapping at small fish, kept missing.\n\nAnd then the herd came — the water erupting with thousands of wildebeest plunging across — and Nile, exactly where he had waited for days, took a huge animal in one explosive lunge, and gorged, and would not need to eat again for a long time.\n\n\"The patience others cannot manage,\" said Nile, \"is what puts me in the right place for the great moment. I outwait everyone, and the feast comes to me.\"\n\nGreat patience puts you in the right place for the moment that others, too restless to wait, will miss. Learn to outwait.\n\nGoodnight, Nile crocodiles. 🌙", "river_otter": "Ollie played all day and the playing was secretly how he stayed so good.\n\nHe was a river otter, and he seemed to do nothing but play — sliding down muddy banks, wrestling, chasing, tumbling through the water for the sheer joy of it. A serious young muskrat watched, disapproving.\n\n\"You play all day,\" said the muskrat. \"Sliding, wrestling, splashing about. Shouldn't you be working — finding food, being useful? All that play is a waste.\"\n\n\"The play *is* the work,\" said Ollie. \"Watch me hunt, and you'll see.\"\n\nWhen Ollie hunted, he was astonishing — twisting, darting, rolling through the water with impossible agility, catching fish that flashed and dodged, his body quick and supple and perfectly coordinated. And every move he made in the hunt was a move he had practiced a thousand times in play: the twists, the sudden turns, the chases, the wrestling grip.\n\n\"All that sliding and wrestling and chasing,\" said Ollie, \"is how I stay this fast, this strong, this sharp. Play keeps my body ready and my skills honed. When the moment to hunt comes, I am already the quickest thing in the river — because I never stopped practicing, even when it looked like I was only having fun. The play looks like a waste to you. It is the very thing that makes me good.\"\n\nThe muskrat watched Ollie catch fish after fish with joyful ease, and began to understand that the play had never been idle at all.\n\nPlay and joy are not always a waste — sometimes they are how you stay sharp and ready. Keep what keeps you strong, even when it looks like fun.\n\nGoodnight, river otters. 🌙", "pink_river_dolphin": "Rosa found her way through the flooded forest where the water hid every path.\n\nShe was a pink river dolphin, and the Amazon had flooded, drowning the forest so that she swam among the submerged trees in dark, murky water where nothing could be seen. A young dolphin, Pip, was lost and frightened.\n\n\"I can't see anything,\" said Pip. \"The water's too dark and full of trees and branches. I don't know which way to go. How do you find your way, or find fish, in all this murk?\"\n\n\"I don't use my eyes,\" said Rosa. \"The water is too dark for eyes. I use sound.\"\n\nRosa sent out clicks — and listened to the echoes bouncing back off the trees, the branches, the fish hiding among the drowned roots. From the returning sound she built a picture of the whole flooded forest in the dark: every trunk to weave around, every fish to catch, a map made of echoes where eyes showed nothing at all.\n\n\"The flooded forest is a maze,\" said Rosa, \"and the water is too murky to see through. A dolphin that hunted by sight would be lost and hungry here. But I click, and I listen, and the echoes show me everything — the trees, the way through, the fish. I navigate the dark water by sound. It is why I can go where the water is thick and black, where sight is useless, and still find my way and my food.\"\n\nPip tried it — clicking, listening — and slowly the dark maze of drowned trees took shape in sound, a way through where a moment ago there had been only blind murk.\n\nWhen you cannot see your way, find another way to sense it. What is invisible to the eye can be mapped by other means.\n\nGoodnight, pink river dolphins. 🌙", "wild_dog": "Painted's pack shared everything, even with those who could not hunt.\n\nHe was an African wild dog — a painted dog — and his pack had just made a kill after a long hunt. A young dog, Pip, went to eat, but noticed something: the hunters were letting the pups, and an old injured dog who had not hunted at all, eat first.\n\n\"Why do they eat first?\" said Pip. \"The pups didn't hunt. That old dog is hurt, he did nothing. We did all the running and catching. Shouldn't we eat first?\"\n\n\"Because we are a pack,\" said Painted, \"and a pack shares with all its own — even those who cannot hunt.\"\n\nAfrican wild dogs are famous for this: after a hunt, they let the pups eat first, and they bring food back for the sick, the injured, and the old who could not join the chase. No member is left to starve because they could not contribute that day. The pack takes care of all of it.\n\n\"The pups cannot hunt yet, but they are our future,\" said Painted. \"The old one hunted for years and is hurt now — we do not abandon him for it. Today we are strong and we hunt; one day we may be the ones too young, or too old, or too hurt to run, and the pack will feed us then. We share with all our own. That is what makes us a pack and not just a group of dogs who happen to run together.\"\n\nPip stepped back and let the pups and the old dog eat, and felt the strength of belonging to something that would never leave him behind.\n\nA true group takes care of all its members — the young, the old, the struggling. Share with those who cannot always contribute; one day you may need the same.\n\nGoodnight, wild dogs. 🌙", "zebra_savanna": "Zara's stripes only worked in the herd and a young one kept wandering off.\n\nShe was a plains zebra, and a young zebra, Pip, kept drifting away from the herd to graze alone on the sweeter grass at the edges.\n\n\"Stay close,\" said Zara. \"Your stripes only protect you here, among all of us.\"\n\n\"But the grass is better out at the edge,\" said Pip. \"And what do my stripes matter anyway? I stand out either way.\"\n\n\"Alone, you stand out,\" said Zara. \"Together, we all disappear. That is the whole secret of the stripes.\"\n\nWhen the lions came, Zara showed Pip the truth. The herd bunched and ran as one — and all their stripes blurred together into a dazzling, shifting mass of black and white, so that the lions could not fix on where one zebra ended and another began, could not lock onto a single target in the churning confusion. But a lone zebra, out at the edge, was one clear shape on open grass — easy to see, easy to catch.\n\n\"One zebra's stripes are nothing,\" said Zara. \"A whole herd's stripes, moving together, are a wall of confusion no lion can read. Stay in the herd and you vanish into all of us. Wander off alone, and the very stripes that hide you in the group make you a clear target by yourself. The sweeter grass at the edge is not worth being the one the lion can actually see.\"\n\nPip drew back into the herd, into the mass of stripes, and when the lions charged, the confusion of the many kept every one of them safe — including Pip.\n\nSome protection only works when you stay with your group. Alone you are exposed; together you disappear. Do not stray for small rewards.\n\nGoodnight, zebras. 🌙"};
const C=CORE.categories;
const A=CORE.animals;
const S=STORIES;

function gc(k){ return C.find(function(c){ return c.key===k; }); }
function ga(c){ return Object.keys(A).filter(function(k){ return A[k].category===c; }).map(function(k){ var a=A[k]; a.key=k; return a; }); }

function getStory(k,n1,n2){
  var t = S[k] || "Goodnight. \uD83C\uDF19";
  return t.split("\u00A7N1\u00A7").join(n1).split("\u00A7N2\u00A7").join(n2);
}

function makeChunks(t){
  var sents=[]; var cur="";
  for(var i=0;i<t.length;i++){
    cur+=t[i];
    if((t[i]==="."||t[i]==="!"||t[i]==="?")&&cur.trim().length>20){
      sents.push(cur.trim()); cur="";
    }
  }
  if(cur.trim()) sents.push(cur.trim());
  if(!sents.length) return [t];
  var n=Math.min(7,sents.length);
  var z=Math.ceil(sents.length/n);
  var out=[];
  for(var i=0;i<sents.length;i+=z) out.push(sents.slice(i,i+z).join(" "));
  return out;
}

function getRead(){ try{ return JSON.parse(localStorage.getItem("read")||"{}"); }catch(e){ return {}; } }
function markRead(k){ try{ var r=getRead(); r[k]=true; localStorage.setItem("read",JSON.stringify(r)); }catch(e){} }

// State
var st = { pg:"home", cat:null, ak:null, n1:"Carson", n2:"Avery", cks:[], idx:0, typed:"", typing:false, tm:null };
var voiceOn = false;

function setState(p){ Object.assign(st,p); render(); }

// Navigation - use data attributes on buttons, attach listeners after render
function render(){
  var el = document.getElementById("app");
  var ci = st.cat ? gc(st.cat) : null;
  var an = st.ak ? A[st.ak] : null;
  var bg = an ? an.bg : ci ? ci.bg : "#010b14";
  document.body.style.background = bg;

  if(st.pg==="home"){ renderHome(el); return; }
  if(st.pg==="cat" && ci){ renderCat(el,ci); return; }
  if(st.pg==="info" && an){ renderInfo(el,an,ci); return; }
  if(st.pg==="story" && an){ renderStory(el,an); return; }
}

function el(tag,attrs,inner){
  var s="<"+tag;
  for(var k in attrs) s+=" "+k+"=\""+attrs[k].toString().replace(/"/g,"&quot;")+"\"";
  return s+">"+inner+"</"+tag+">";
}

function btn(label,color,full){
  return "<button class=\"abtn\" data-color=\""+color+"\" style=\"width:"+(full?"100%":"auto")+";display:block;margin-bottom:8px;padding:13px;border-radius:12px;color:#fff;font-size:15px;background:linear-gradient(135deg,"+color+"33,"+color+"55);border:1px solid "+color+"77\">"+label+"</button>";
}

function renderHome(el){
  var html = "<div class=\"s\"><div style=\"text-align:center;padding:24px 0 18px\"><div style=\"font-size:48px\">🌙</div><h1 style=\"font-size:20px;margin:8px 0 4px\">Bedtime Animal Adventures</h1><p style=\"color:rgba(255,255,255,.45);font-size:13px\">Choose a habitat</p></div><div class=\"g3\">";
  C.forEach(function(c){
    html += "<button class=\"catbtn\" data-cat=\""+c.key+"\" style=\"background:linear-gradient(135deg,"+c.color+"0a,"+c.color+"20);border:1px solid "+c.color+"44;border-radius:12px;padding:10px 4px;text-align:center;width:100%\"><div style=\"font-size:22px\">"+c.emoji+"</div><div style=\"font-size:9px;color:"+c.color+";font-weight:bold;margin-top:3px;line-height:1.2\">"+c.label+"</div><div style=\"font-size:8px;color:rgba(255,255,255,.3);margin-top:2px\">"+ga(c.key).length+"</div></button>";
  });
  html += "</div></div>";
  el.innerHTML = html;
  el.querySelectorAll(".catbtn").forEach(function(b){
    b.addEventListener("click", function(){ setState({pg:"cat",cat:this.dataset.cat}); });
  });
}

function renderCat(el,ci){
  var read = getRead();
  var html = "<div class=\"s\"><button class=\"back homebtn\">← Back</button><div style=\"text-align:center;margin-bottom:18px\"><div style=\"font-size:38px\">"+ci.emoji+"</div><h2 style=\"color:"+ci.color+";margin:6px 0\">"+ci.label+"</h2><p style=\"color:rgba(255,255,255,.4);font-size:13px\">"+ci.desc+"</p></div><div class=\"g2\">";
  ga(st.cat).forEach(function(a){
    var done = read[a.key];
    html += "<button class=\"anbtn\" data-key=\""+a.key+"\" style=\"background:linear-gradient(135deg,"+a.accent+(done?"44":"0a")+","+a.accent+(done?"66":"20")+");border:"+(done?"2":"1")+"px solid "+a.accent+(done?"99":"44")+";border-radius:12px;padding:14px 8px;text-align:center;position:relative\">"+(done?"<div style=\"position:absolute;top:5px;right:7px;font-size:12px\">✅</div>":"")+"<div style=\"font-size:30px\">"+a.emoji+"</div><div style=\"font-size:12px;color:"+a.accent+";font-weight:bold;margin-top:5px\">"+a.name+"</div></button>";
  });
  html += "</div></div>";
  el.innerHTML = html;
  el.querySelector(".homebtn").addEventListener("click", function(){ setState({pg:"home",cat:null,ak:null}); });
  el.querySelectorAll(".anbtn").forEach(function(b){
    var pressTimer = null;
    b.addEventListener("click", function(){ setState({pg:"info",ak:this.dataset.key}); });
    b.addEventListener("mousedown", function(){
      var key = this.dataset.key;
      pressTimer = setTimeout(function(){
        pressTimer = null;
        var r = getRead();
        if(r[key]){ delete r[key]; } else { r[key] = true; }
        try{ localStorage.setItem("read", JSON.stringify(r)); }catch(e){}
        setState({pg:"cat"});
      }, 600);
    });
    b.addEventListener("mouseup", function(){ clearTimeout(pressTimer); });
    b.addEventListener("mouseleave", function(){ clearTimeout(pressTimer); });
    b.addEventListener("touchstart", function(e){
      var key = this.dataset.key;
      var self = this;
      pressTimer = setTimeout(function(){
        pressTimer = null;
        var r = getRead();
        if(r[key]){ delete r[key]; } else { r[key] = true; }
        try{ localStorage.setItem("read", JSON.stringify(r)); }catch(e){}
        // vibrate if supported
        if(navigator.vibrate) navigator.vibrate(50);
        setState({pg:"cat"});
      }, 600);
    }, {passive:false});
    b.addEventListener("touchend", function(e){
      if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
      else { e.preventDefault(); }
    });
    b.addEventListener("touchmove", function(){ clearTimeout(pressTimer); pressTimer=null; });
    b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  });
}

  var ac = an.accent;
  var suffix = Math.random()<0.5?" eating":" teeth";
  var imgurl = "https://www.google.com/search?q="+encodeURIComponent(an.name+suffix)+"&tbm=isch";
  var html = "<div class=\"s\">"
    +"<button class=\"back catbtn2\">← Back</button>"
    +"<a href=\""+imgurl+"\" target=\"_blank\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;border-radius:14px;margin-bottom:14px;text-decoration:none;background:linear-gradient(135deg,"+an.bg+","+ac+"22);border:1px solid "+ac+"55\">"
    +"<div style=\"font-size:72px\">"+an.emoji+"</div><div style=\"font-size:14px;color:"+ac+";font-weight:bold;margin-top:8px\">"+an.name+"</div><div style=\"font-size:11px;color:"+ac+";opacity:.6;margin-top:4px\">📷 tap for photos</div></a>"
    +"<div class=\"card\" style=\"border:1px solid "+ac+"28;margin-bottom:10px\"><div style=\"font-size:10px;color:"+ac+";font-weight:bold;margin-bottom:6px;text-transform:uppercase\">🏠 Habitat</div><div style=\"font-size:13px;color:rgba(255,255,255,.8)\">"+an.habitatEmoji+" "+an.habitat+"</div></div>"
    +"<div class=\"g2\" style=\"margin-bottom:10px\">"
    +"<div class=\"card\" style=\"border:1px solid "+ac+"28\"><div style=\"font-size:10px;color:#f87171;font-weight:bold;margin-bottom:6px;text-transform:uppercase\">⚠️ Predators</div>"+an.predators.map(function(p){ return "<div style=\"font-size:12px;color:rgba(255,255,255,.7);padding:2px 0\">"+p+"</div>"; }).join("")+"</div>"
    +"<div class=\"card\" style=\"border:1px solid "+ac+"28\"><div style=\"font-size:10px;color:#4ade80;font-weight:bold;margin-bottom:6px;text-transform:uppercase\">🍖 Prey</div>"+an.prey.map(function(p){ return "<div style=\"font-size:12px;color:rgba(255,255,255,.7);padding:2px 0\">"+p+"</div>"; }).join("")+"</div>"
    +"</div>"
    +"<div class=\"card\" style=\"border:1px solid "+ac+"28;margin-bottom:10px\"><div style=\"font-size:10px;color:"+ac+";font-weight:bold;margin-bottom:8px;text-transform:uppercase\">✨ Amazing Facts</div>"+an.facts.map(function(f){ return "<div style=\"font-size:13px;color:rgba(255,255,255,.8);padding:3px 0\">"+f+"</div>"; }).join("")+"</div>"
    +"<div class=\"card\" style=\"border:1px solid "+ac+"28;margin-bottom:14px\"><div style=\"font-size:10px;color:"+ac+";font-weight:bold;margin-bottom:8px;text-transform:uppercase\">Name Your Adventurers</div>"
    +"<div class=\"g2\"><input id=\"n1\" placeholder=\"Carson\" value=\""+st.n1+"\" style=\"background:rgba(255,255,255,.07);border:1px solid "+ac+"44;border-radius:8px;padding:9px 10px;color:#fff;font-size:13px;width:100%\">"
    +"<input id=\"n2\" placeholder=\"Avery\" value=\""+st.n2+"\" style=\"background:rgba(255,255,255,.07);border:1px solid "+ac+"44;border-radius:8px;padding:9px 10px;color:#fff;font-size:13px;width:100%\"></div></div>"
    +"<button class=\"beginbtn\" style=\"width:100%;background:linear-gradient(135deg,"+ac+"33,"+ac+"55);border:1px solid "+ac+"77;border-radius:12px;padding:14px;color:#fff;font-size:16px;font-weight:bold\">✨ Begin the Adventure</button>"
    +"</div>";
  el.innerHTML = html;
  el.querySelector(".catbtn2").addEventListener("click", function(){ setState({pg:"cat"}); });
  el.querySelector(".beginbtn").addEventListener("click", function(){
    var n1=document.getElementById("n1").value||"Carson";
    var n2=document.getElementById("n2").value||"Avery";
    var cks=makeChunks(getStory(st.ak,n1,n2));
    Object.assign(st,{pg:"story",n1:n1,n2:n2,cks:cks,idx:0,typed:"",typing:false});
    render();
    setTimeout(function(){ typeChunk(0); },30);
  });
}

function renderStory(el,an){
  var ac = an.accent;
  var pct = ((st.idx+(st.typing?.5:1))/st.cks.length)*100;
  var html = "<div class=\"s\">"
    +"<button class=\"back infobtn\">← Back</button>"
    +"<div style=\"text-align:center;margin-bottom:12px\">"
    +"<div style=\"font-size:30px\">"+an.emoji+"</div>"
    +"<div style=\"background:rgba(255,255,255,.1);border-radius:99px;height:5px;margin:8px 0;overflow:hidden\"><div id=\"progbar\" style=\"height:100%;background:"+ac+";width:"+pct+"%;border-radius:99px;transition:width .3s\"></div></div>"
    +"<div id=\"ctr\" style=\"font-size:10px;color:rgba(255,255,255,.35)\">"+(st.idx+1)+" / "+st.cks.length+"</div>"
    +"<button id=\"vbtn\" style=\"margin-top:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer\">"+(voiceOn?"🔇 Stop reading":"🔊 Read aloud")+"</button>"
    +"</div>"
    +"<div class=\"card\" style=\"border:1px solid "+ac+"33;min-height:150px;margin-bottom:14px;line-height:1.9\"><span id=\"tt\" style=\"color:rgba(255,255,255,.9);font-size:18px\">"+st.typed+"</span>"+(st.typing?"<span style=\"opacity:.4\">▋</span>":"")+"</div>"
    +"<div id=\"sb\"></div></div>";
  el.innerHTML = html;
  el.querySelector(".infobtn").addEventListener("click", function(){ 
    clearInterval(st.tm); voiceOn=false;
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    setState({pg:"info"});
  });
  document.getElementById("vbtn").addEventListener("click", function(){
    voiceOn=!voiceOn;
    this.textContent = voiceOn ? "🔇 Stop reading" : "🔊 Read aloud";
    if(voiceOn){ speakNow(); } else { if(window.speechSynthesis) window.speechSynthesis.cancel(); }
  });
  renderBtns(ac);
}

function renderBtns(ac){
  var el=document.getElementById("sb"); if(!el) return;
  var done=!st.typing&&st.idx===st.cks.length-1;
  if(st.typing){
    el.innerHTML="<button id=\"skipbtn\" style=\"width:100%;display:block;padding:13px;border-radius:12px;color:#fff;font-size:15px;background:linear-gradient(135deg,"+ac+"33,"+ac+"55);border:1px solid "+ac+"77\">Skip ahead →</button>";
    document.getElementById("skipbtn").addEventListener("click",function(){ clearInterval(st.tm); st.typed=st.cks[st.idx]||""; st.typing=false; var t=document.getElementById("tt"); if(t) t.textContent=st.typed; renderBtns(ac); });
  } else if(done){
    el.innerHTML="<div style=\"text-align:center;font-size:20px;margin-bottom:10px\">🌙 Sweet dreams!</div>"
      +"<button id=\"againbtn\" style=\"width:100%;display:block;margin-bottom:8px;padding:13px;border-radius:12px;color:#fff;font-size:15px;background:linear-gradient(135deg,"+ac+"33,"+ac+"55);border:1px solid "+ac+"77\">Read Again</button>"
      +"<button id=\"homebtn2\" style=\"width:100%;display:block;padding:13px;border-radius:12px;color:#fff;font-size:15px;background:linear-gradient(135deg,"+ac+"33,"+ac+"55);border:1px solid "+ac+"77\">Choose Another Animal</button>";
    document.getElementById("againbtn").addEventListener("click",function(){ typeChunk(0); });
    document.getElementById("homebtn2").addEventListener("click",function(){ clearInterval(st.tm); voiceOn=false; if(window.speechSynthesis) window.speechSynthesis.cancel(); setState({pg:"home",cat:null,ak:null}); });
  } else {
    el.innerHTML="<button id=\"nxtbtn\" style=\"width:100%;display:block;padding:13px;border-radius:12px;color:#fff;font-size:15px;background:linear-gradient(135deg,"+ac+"33,"+ac+"55);border:1px solid "+ac+"77\">Continue →</button>";
    document.getElementById("nxtbtn").addEventListener("click",function(){ typeChunk(st.idx+1); });
  }
}

function updateProgress(){
  var an=A[st.ak]; if(!an) return;
  var ac=an.accent;
  var pct=((st.idx+(st.typing?.5:1))/st.cks.length)*100;
  var bar=document.getElementById("progbar");
  var ctr=document.getElementById("ctr");
  if(bar) bar.style.width=pct+"%";
  if(ctr) ctr.textContent=(st.idx+1)+" / "+st.cks.length;
}

function typeChunk(i){
  clearInterval(st.tm);
  st.idx=i; st.typed=""; st.typing=true;
  updateProgress();
  var t=st.cks[i]||""; var j=0;
  var ac=A[st.ak].accent;
  var ttEl=document.getElementById("tt");
  if(!ttEl){ render(); ttEl=document.getElementById("tt"); }
  // Show skip button immediately
  renderBtns(ac);
  st.tm=setInterval(function(){
    j++; st.typed=t.slice(0,j);
    if(ttEl) ttEl.textContent=st.typed;
    if(j>=t.length){
      clearInterval(st.tm); st.tm=null; st.typing=false;
      if(i===st.cks.length-1) markRead(st.ak);
      updateProgress();
      renderBtns(ac);
      if(voiceOn) speakNow();
    }
  },18);
}

function speakNow(){
  if(!voiceOn||!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(st.cks[st.idx]||"");
  u.rate=0.85; u.pitch=1.0;
  var vs=window.speechSynthesis.getVoices();
  var v=vs.find(function(x){ return x.name.includes("Samantha")||x.name.includes("Karen")||x.lang==="en-US"; });
  if(v) u.voice=v;
  window.speechSynthesis.speak(u);
}

render();
</script>
