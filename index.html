eless, and Carson — who was the only snake in the entire forest who bothered eating cicadas — lost his composure completely.\n\nHe ate eleven.\n\nThen sixteen.\n\nBy Thursday afternoon he was lying at the base of the oak in a state that could only be described as *architectural*, being roughly the shape and mobility of a sock full of gravel.\n\nFinn the wood thrush landed nearby and looked at him.\n\n\"You have overdone it,\" said Finn.\n\n\"I have not.\"\n\n\"You are a different shape.\"\n\n\"I am *seasonally adjusted*,\" said Carson, with tremendous dignity and almost no ability to move.\n\nA raccoon came through the clearing an hour later.\n\nThis was, ordinarily, not a problem. Carson was venomous and quick and raccoons knew better. But Carson was currently about as quick as a fallen log, and the raccoon looked at him for quite a long time, doing sums.\n\nAvery arrived from the leaf litter and put herself, coolly, between them.\n\nThe raccoon reconsidered and left.\n\n\"You could have been eaten,\" said Avery, \"by a *raccoon*. Because of *cicadas*.\"\n\n\"They only come every seventeen years,\" said Carson, from the ground.\n\n\"That is not the defence you think it is.\"\n\nHe could not move properly until Saturday. He heard about it for the rest of the summer.\n\nEnough is a thing you have to decide *before* you start, not after.\n\nGoodnight, copperheads. 🌙", "spitting_cobra": "The mongoose kit had fallen into the drainage channel and could not get out.\n\nThis was, from Carson's position, an almost perfect piece of news. Mongooses hunted cobras. A mongoose in a hole was a mongoose that would not be growing up to hunt cobras.\n\nHe could simply leave.\n\nHe looked down at it for a long time. It was very small. It was scrabbling at the concrete and getting nowhere and making a thin, awful noise that carried up the channel and out across the riverbank.\n\nThe noise was the problem. Because it was going to bring something.\n\nThe martial eagle came in low and fast, twenty minutes later, exactly as Carson had known it would.\n\nCarson was already on the lip of the channel.\n\nHe reared up as the eagle dropped, spread his hood, and spat — a fine, accurate arc of venom that caught the bird full across the face at a range of two metres.\n\nThe eagle screamed and pulled up hard and hit the fence and went away, half-blind and furious, and did not come back.\n\nKesi the mongoose found her kit an hour later, when Carson had long since gone back to the reeds.\n\nShe stood at the edge of the channel and looked at the venom spatter on the concrete lip. She looked at the eagle feathers in the grass. She was not a stupid animal and it did not take her very long.\n\nShe looked, for a long moment, at the reeds where she knew perfectly well that Carson was lying.\n\nThen she took her kit and went home.\n\nThat autumn, Kesi's family moved their den. The new one was a hundred metres up the bank, well clear of the reeds. Nobody said anything about it. Nobody ever did.\n\nYou do not always get thanked. Sometimes you get something better — a boundary quietly honoured for the rest of your life.\n\nGoodnight, Mozambique spitting cobras. 🌙", "timber_rattlesnake": "Carson had been thirty-one years old when the boy nearly stepped on him.\n\nHe remembered it because of the apology. Nobody apologises to a rattlesnake. But the boy — twelve, maybe thirteen, with a stick and a water bottle and enormous frightened eyes — had frozen, and looked down, and said *sorry*, and gone very carefully around him through the grass.\n\nCarson had thought about it for weeks. He did not know why.\n\nThe years went by. The forest changed a little. The flat rock stayed warm and Carson kept coming back to it, as he had for twenty-three years and then twenty-eight and then thirty-two.\n\nHe was thirty-nine when the men came with the machinery.\n\nThey were surveying — stakes in the ground, orange tape on the trees, a line running straight through the hibernaculum where forty-three snakes had wintered together for as long as Carson had been alive. Edna was down there. Edna had been down there for forty-six years.\n\nThe men came back in the spring with a clipboard, and one of them stopped.\n\nHe was in his thirties now. He had a beard and a state badge on his jacket and he crouched down at the mouth of the den and looked at it for a very long time.\n\nThen he stood up and said, to the others, \"We're moving the line.\"\n\nThere was an argument. He won it.\n\nCarson watched all of this from the rocks above, without any real understanding of what was happening, except that the machines went somewhere else and the orange tape came down and the den stayed.\n\nThe man looked up at the rocks before he left. He did not see Carson. But he looked.\n\nHe had said *sorry* to a rattlesnake once, when he was twelve, and had never quite stopped thinking about it either.\n\nYou never know which small kindness is going to come back. Do them anyway.\n\nGoodnight, timber rattlesnakes. 🌙", "milk_snake": "Felix the barn cat had been living under the hay bales for three seasons because of Carson, and neither of them was happy about it.\n\nFelix was afraid of him. Carson knew this. Carson had explained, many times, in great detail, that he was a milk snake and not a coral snake and that the bands went red-black-red and not red-yellow-red and that he had never in his life been venomous.\n\nFelix did not care. Felix had heard a story once and the story had won.\n\nSo Felix stayed under the hay, and did not hunt, and the mice — who had noticed all of this — had moved into the far end of the barn where Carson did not go, and were currently eating their way through the winter seed at a rate that was becoming a genuine problem.\n\nRosa the farmer noticed the seed going. She could not work out why.\n\n\"He will not come out,\" Carson told Avery, from the rafters. \"I have tried.\"\n\n\"You have *told* him,\" said Avery. \"That is not the same as trying.\"\n\nCarson considered this and did not like it.\n\nThe next night he went to the hay bales, and instead of explaining anything, he simply killed a mouse two feet from Felix's face — quickly, with his coils, the way constrictors do — and then went away and left it there.\n\nHe did this for four nights.\n\nOn the fifth night Felix came out.\n\nNot because he had understood the bands. Because he had watched, five times, an animal that could have bitten him choose to do something else instead.\n\nThey hunted the far end of the barn together, badly and awkwardly, and the mice — who had never in their lives had to deal with a cat *and* a snake — had a catastrophic week.\n\nRosa found the seed store secure by the end of the month and had no idea why.\n\nFelix never apologised. Carson never asked him to.\n\nSometimes you cannot argue someone out of being afraid of you. You can only keep showing up until they run out of reasons.\n\nGoodnight, milk snakes. 🌙", "sidewinder": "Carson decided, at the age of two, that he would learn to move properly.\n\nThe other snakes in the wash went in straight lines. Smooth, direct, dignified. Carson threw himself sideways in loops and left ridiculous J-shaped tracks in the sand and had been mocked for it exactly once, by a young racer, in a way that had lodged in him and would not come out.\n\nSo he practised.\n\nHe practised straight-line movement all summer, on the cool sand at night when nobody was watching, and by August he was quite good at it.\n\nHe was also, by August, badly burned.\n\nBecause the desert sand at midday is hot enough to kill a snake, and the sidewinder's ridiculous looping motion exists for exactly one reason: it keeps most of your body off the ground. Carson had spent a summer training himself out of the only thing standing between him and the heat.\n\nHe got caught in the open on a bad afternoon in September. He tried to go straight — habit now, and faster, and *wrong* — and the sand took the scales off his belly in a long ugly stripe and he barely made the shade of the creosote.\n\nAvery found him there.\n\nShe did not say anything for a while.\n\n\"It was the racer,\" he said finally. \"Two years ago. He laughed.\"\n\n\"He laughed,\" Avery agreed, \"and then he moved to the rocks, because he cannot cross open sand at all.\"\n\nCarson had not known that.\n\nHe lay in the shade for a long time thinking about it.\n\nHe healed. He went back to sidewinding, and he was fast and efficient and cool-bellied and he never tried to move like anything else again, and the J-shaped tracks behind him in the sand stopped looking like a flaw and started looking like a signature.\n\nDo not train yourself out of the thing that keeps you alive because somebody laughed at it once.\n\nGoodnight, sidewinders. 🌙", "vine_snake": "The hornbill had Carson's tail in its beak and was not letting go.\n\nThis was not supposed to be able to happen. Carson was a vine snake. He was thin and green and he looked exactly like a hanging vine, and hornbills had been landing on branches beside him for years without ever once realising.\n\nBut this one had seen him move.\n\nIt had him by six inches of tail and it was hauling him off the branch, and Carson had his coils locked around the wood and was losing.\n\nHe had no venom that would matter fast enough. He had no strength that could win this. He had nothing.\n\nSo he did the only thing he had left, which was a thing he had never actually used in his life and had always privately considered a bit theatrical.\n\nHe inflated his neck.\n\nThe scales pulled apart and the bright stripes came up between them — a sudden shocking flash of colour where a second ago there had been a plain green branch — and he opened his mouth and made himself into something that was not a vine and was not a snake and was not, from six inches away, anything the hornbill had ever seen.\n\nThe hornbill let go.\n\nNot because it was hurt. Because it was *startled* — one half-second of pure animal confusion — and half a second was all Carson needed to get back onto the branch and into the foliage and gone.\n\nAvery found him an hour later, three trees away, still shaking.\n\n\"Your tail,\" she said.\n\n\"I know.\"\n\n\"It will grow back badly.\"\n\n\"I know.\"\n\nShe was quiet for a while.\n\n\"You have never used the stripes,\" she said.\n\n\"No,\" said Carson. \"I always thought they were silly. Too much. Not my style.\" He looked at the ruin of his tail. \"I nearly died holding on to being subtle.\"\n\nSave nothing for later. Later is not guaranteed.\n\nGoodnight, vine snakes. 🌙", "cottonmouth": "Stretch the heron had never backed down from anything, which is why he was going to lose an eye.\n\nHe was young. He was tall. He had been fishing this stretch of swamp for two months and had decided, with the total conviction of the very inexperienced, that the log belonged to him.\n\nThe log belonged to Carson.\n\n\"That is my log,\" said Stretch.\n\nCarson opened his mouth. The inside of it was startlingly, brilliantly white — a warning so old and so clear that almost every animal in the swamp understood it without being taught.\n\nStretch did not move.\n\n\"I am not afraid of you,\" he said.\n\n\"I know,\" said Carson, around the open mouth. \"That is the problem. Fear is useful. It stops you doing things you cannot undo.\"\n\n\"You will not bite me.\"\n\n\"I will not bite you *first*,\" Carson agreed. \"That is not the same as what you said.\"\n\nThey stood there. The swamp went quiet in the way it does.\n\nAnd Stretch — who had never backed down from anything, and who was one full second away from putting his beak somewhere it could not be taken back from — noticed something.\n\nHe noticed that Carson's mouth had been open for a very long time now. Longer than was comfortable. Longer than an animal would hold it if it was actually about to strike.\n\nHe was being *given time*.\n\nThe realisation arrived all at once, the way they do.\n\nStretch took four steps back. Then four more. He fished the far end of the bank and did not look at the log again.\n\nThat night, older and quieter, he understood that he had not been outfought. He had been *waited on* — patiently, deliberately, by something that could have ended it in a tenth of a second and had chosen, instead, to hold its mouth open and let him think.\n\nThe strong ones give you time. Use it.\n\nGoodnight, cottonmouths. 🌙", "saw_scaled_viper": "Carson was two feet long and the monitor lizard was six, and it was coming for the eggs.\n\nAvery's eggs. She was somewhere south, hunting, and had been gone since dawn, and the monitor had found the crevice and was working its head into the gap with slow, unhurried, absolutely inevitable patience.\n\nCarson could not fight it. Two feet of viper against six feet of monitor is not a fight, it is a delay.\n\nSo he made himself a delay.\n\nHe came out of the rocks rasping — that dry, sawing, sandpaper sound that saw-scaled vipers make by grinding their scales against each other, a noise that carries and carries and does not stop.\n\nThe monitor turned.\n\nCarson struck at its face and missed on purpose and went backward, still rasping, and the monitor followed — because monitors are curious and greedy and this small furious noisy thing was more interesting than a hole.\n\nHe led it forty metres.\n\nHe struck at it eleven times. He connected twice, and neither bite went deep enough to matter to something that size, and the monitor kept coming, and Carson kept going backward, and the rasping never stopped.\n\nAt sixty metres the monitor had had enough of being harassed by something it could not catch and turned back toward the crevice.\n\nCarson got in front of it again.\n\nAt ninety metres, Avery arrived from the south at a speed Carson had never seen from her.\n\nThe two of them together were still not a match for a monitor lizard. But two furious vipers rasping and striking from both sides is a different arithmetic than one, and the monitor — which had come for eggs and was now bleeding from the jaw and being screamed at from two directions — decided the eggs were not worth it.\n\nIt left.\n\nCarson sat down in the dust, entirely spent.\n\n\"You could not have beaten it,\" said Avery.\n\n\"No,\" said Carson. \"I only had to be *inconvenient* until you got here.\"\n\nYou do not always have to win. Sometimes you only have to hold on long enough.\n\nGoodnight, saw-scaled vipers. 🌙", "garter_snake": "Olly did not come out of the den.\n\nTen thousand garter snakes came out of that hillside on the first warm morning of spring — a great writhing tide of them, pouring over the rocks into the sun — and somewhere in the middle of it Carson realised that the small snake who had been beside him all winter was not there.\n\nHe went back in.\n\nThis is not a thing garter snakes do. The den in spring is chaos — thousands of bodies, no light, no air, everyone pushing outward at once. Going *in* means going against all of it.\n\nHe went in.\n\nHe found Olly forty feet down, wedged in a crack in the limestone, wide-eyed and stuck fast and far too cold to move properly.\n\n\"I could not get out,\" said Olly.\n\n\"I know.\"\n\n\"Everyone went past me.\"\n\n\"I know,\" said Carson. \"They did not know.\"\n\nHe could not pull him free. He was not strong enough and there was no room to brace.\n\nSo he did the only thing there was. He wrapped himself around the small cold snake and lay there, in the dark, and waited — while ten thousand snakes climbed over both of them toward the sunlight — until the warmth of his own body brought Olly's temperature up enough that the muscles worked again.\n\nIt took most of the morning.\n\nThey came out together into the light at nearly midday, last of all, and the hillside was a shifting silver-and-black carpet in every direction, and Olly lay in the sun and shook.\n\n\"Nobody noticed I was gone,\" he said.\n\n\"I noticed,\" said Carson.\n\nTen thousand of you does not mean anyone is counting. Be the one who counts.\n\nGoodnight, garter snakes. 🌙", "ball_python": "Carson became a ball eleven times before breakfast.\n\nA leaf. A beetle. A gust of wind. A shadow that turned out to be a cloud. Twice, for no reason he could later identify. Once, humiliatingly, because Avery sneezed.\n\n\"You cannot go on like this,\" said Avery.\n\n\"I am cautious.\"\n\n\"You are a *ball*,\" said Avery. \"You have been a ball for most of the morning. There is a rat forty feet away and it has been eating an entire termite mound while you have been rolling around being frightened of the weather.\"\n\nCarson uncurled with as much dignity as he could manage, which was not a great deal.\n\n\"I will get the rat,\" he said.\n\nHe did not get the rat. A bird flew over and he became a ball again and the rat, which had been watching all of this with what Carson felt was unnecessary interest, wandered off.\n\nPip the grass rat, who lived nearby and had been narrating the morning to his family with great enjoyment, laughed out loud.\n\nThat was the afternoon a leopard came through the grass.\n\nIt came fast and silent and it was on Carson before he had processed anything at all, and it hit him once with a paw the size of his head.\n\nAnd Carson — who had spent his entire life practising exactly one thing, over and over, eleven times before breakfast, for no reason and to universal mockery — became a ball in under half a second.\n\nA perfect one. Head buried in the centre. Not a single soft part exposed.\n\nThe leopard batted him around the clearing for four full minutes. It bit him twice and got nothing but hard scale. It rolled him into a bush, lost interest, and left.\n\nCarson uncurled fifteen minutes later, entirely unharmed.\n\nPip had gone very quiet.\n\n\"Eleven times before breakfast,\" said Carson, and went to find something to eat.\n\nThe thing they laugh at you for practising is often the thing that saves you.\n\nGoodnight, ball pythons. 🌙", "hognose_snake": "Carson had been playing dead for forty minutes and nobody had come to look.\n\nThis was the trouble with the whole business. When you flop onto your back with your tongue out and lie perfectly still, you are entirely at the mercy of how long the other party wants to stand around.\n\nThe other party, in this case, was a red-tailed hawk. And the red-tailed hawk had settled on a fence post and was waiting him out.\n\nHank the box turtle plodded past.\n\n\"You are upside down,\" said Hank.\n\n\"I am dead,\" said Carson, without moving his lips.\n\n\"You are talking.\"\n\n\"Dead snakes talk all the time,\" said Carson. \"It is very common. Go away.\"\n\nHank did not go away. Hank sat down.\n\n\"The hawk is still there,\" Hank observed.\n\n\"I know the hawk is still there.\"\n\n\"Your tongue has gone dry.\"\n\nCarson said nothing, because there was nothing dignified left to say.\n\nTen more minutes went by. The hawk shifted on the post. Carson's back was starting to cramp. A beetle walked across his belly and he did not so much as twitch, which he privately considered to be some of the finest acting of his career and which nobody witnessed or appreciated.\n\nFinally, the hawk got bored and flew off.\n\nCarson rolled over. Very slowly. With enormous dignity.\n\n\"Forty-eight minutes,\" said Hank.\n\n\"I was not counting.\"\n\n\"You were absolutely counting,\" said Hank.\n\nAvery arrived from the bramble, having watched the entire thing.\n\n\"Was it necessary?\" she asked. \"For forty-eight minutes?\"\n\n\"It worked,\" said Carson.\n\n\"Yes,\" said Avery. \"But so would going into the log.\"\n\nCarson looked at the log. It was three feet away. It had been three feet away the entire time.\n\nHe did not answer.\n\nThe best trick in the world is not always the best idea. Sometimes there is a log.\n\nGoodnight, hognose snakes. 🌙", "black_racer": "The coachwhip was faster than Carson, and Carson could not accept it.\n\nThey had raced eleven times across the long meadow — from the stone wall to the far hedge, in a straight line, in front of everybody — and the coachwhip, whose name was Whit, had won ten.\n\nThe one Carson won was because Whit had hit a rabbit hole.\n\n\"Again,\" said Carson.\n\n\"Carson,\" said Avery.\n\n\"*Again.*\"\n\nThey raced again. Whit won by four feet.\n\nCarson lay in the grass afterward with his heart hammering and something worse than tiredness sitting in his chest.\n\n\"You are the fastest snake in North America,\" said Avery.\n\n\"Apparently not.\"\n\n\"You are the fastest *black racer*,\" she said patiently. \"He is a coachwhip. He is built differently. His body is longer and lighter and he is faster in a straight line and he always will be and you are never, ever going to beat him at that.\"\n\nCarson said nothing for a long while.\n\n\"Then what am I for?\"\n\nAvery looked at the meadow. At the tangle of the hedge, and the stone wall with its gaps, and the long grass with its hidden dips and holes.\n\n\"Race him again,\" she said. \"But not in a straight line.\"\n\nThey ran it through the hedge — through the tangle and the roots and the broken stone at the base of the wall.\n\nWhit was faster. It did not matter. Carson turned tighter, read the ground better, went through gaps that Whit had to go around, and came out the far side of the hedge eleven feet ahead.\n\nWhit came out, saw him waiting, and started laughing.\n\n\"Straight lines,\" said Whit. \"You should have said. I would have stopped.\"\n\nSomeone will always be better than you at the thing you keep choosing to compete at. Choose a different thing.\n\nGoodnight, black racers. 🌙", "russells_viper": "Gopal had been killing snakes on his land for sixty years, and he was very good at it.\n\nHe had a long-handled hoe by the door for exactly this purpose. His father had used it. His father's father had used it. When a viper came into the rice field you killed it, and that was not a thing anyone in the village had ever needed to discuss.\n\nThe young man from the university had a different idea, and Gopal did not have much patience for it.\n\n\"Rats,\" said Dev, for the third time. \"Look at the numbers.\"\n\n\"I can see rats,\" said Gopal. \"I have eyes.\"\n\n\"Then look at the *grain*.\"\n\nGopal looked at the grain.\n\nHe had lost more of it every year for six years. He had blamed the weather. He had blamed the store. He had blamed his son-in-law, unfairly, and had not apologised for it.\n\nHe had never once blamed himself, or the hoe by the door.\n\nDev put the paper down on the table. Rat populations, year by year. Snake removals, year by year. The two lines ran together like a pair of tracks.\n\nGopal looked at it for a long time.\n\nThat evening he went out to the bund between the fields, where a heavy-bodied Russell's viper had been lying in the same spot for three days and which he had been intending, all week, to deal with.\n\nHe stood over it with the hoe.\n\nCarson looked back up at him without moving. He was aware, in whatever way a snake is aware of such things, that he was in a great deal of trouble and that there was nothing at all he could do about it.\n\nGopal stood there for a full minute.\n\nThen he went back to the house and put the hoe in the shed and did not take it out again.\n\nHe did not tell anyone why. His son-in-law noticed the hoe was gone and said nothing. The grain held that winter, and held again the next.\n\nGopal never once liked the vipers. He simply stopped killing them, which was harder, and which mattered more.\n\nYou do not have to love a thing to stop harming it. You only have to be honest about what it does.\n\nGoodnight, Russell's vipers. 🌙", "eastern_rat_snake": "The rats had moved into the roof and Carson could not get to them.\n\nHe could climb — he was an eastern rat snake, he could climb almost anything, straight up the rough bark of an oak, straight up the split boards of a barn wall. That was not the problem.\n\nThe problem was the metal.\n\nRosa had put a strip of tin around the base of the barn to stop something else, and it went right around, and it was smooth, and it had also — entirely by accident — stopped Carson.\n\nHe tried it eleven times.\n\nHe tried it on the north wall, where the tin had a seam. He tried it on the south wall, where a nail head stuck out a half-inch. He got four feet up on the nail head and slid all the way back down.\n\nMeanwhile the rats ate.\n\nHe could hear them at night, over his head in the rafters, working through the winter seed while he lay on the ground below completely unable to reach them, and it was, he thought, one of the more humiliating experiences of his life.\n\nPip the barn owl was no help. \"I fly,\" said Pip. \"I do not know what to tell you.\"\n\nAvery said: \"The oak.\"\n\n\"The oak is twenty feet from the barn.\"\n\n\"Yes,\" said Avery.\n\nCarson looked at the oak. And then he looked up at the oak — at the big low branch that ran out toward the barn, and stopped eight feet short of the roof, and had been stopping eight feet short of the roof for the entire time he had been trying to climb the tin.\n\nEight feet.\n\nHe climbed the oak, which was easy, and went out along the branch to the very end, where it bent under him and dipped, and he stretched, and he could not reach.\n\nHe went back and tried it three more times.\n\nOn the fourth, he did not stretch. He let the branch bend all the way, and *let go*.\n\nHe landed on the barn roof badly and slid two feet and caught the ridge.\n\nHe got the rats.\n\nThere is more than one way in. If you cannot go through, go up and over and take the fall.\n\nGoodnight, eastern rat snakes. 🌙", "eastern_indigo": "Gus dug the burrow in 1961 and had been sharing it ever since.\n\nGopher tortoises dig, and everything else moves in — the mice, the frogs, the owls, the snakes. Gus had never particularly minded. It was a big burrow and he was a patient animal and the company was, on the whole, all right.\n\nCarson had been using it for nine years.\n\n\"You could dig your own,\" Gus pointed out, occasionally.\n\n\"I could not,\" said Carson, who could not, and they both knew it.\n\nThe fire came in the dry September, the way it does in the pine flatwoods, and it came fast.\n\nCarson was three hundred yards out in the wiregrass when it turned.\n\nHe went for the burrow at a speed he had not managed in years, nine feet of him, running low, with the smoke coming down and the sound of it behind him like a train, and he got there and went straight in and down into the cool dark and lay in the sand at the bottom with his heart going.\n\nThere were fourteen other animals down there.\n\nA rabbit. A frog. Two mice. An indigo, a rattlesnake, and, six inches away from the rattlesnake, a mouse — none of them doing anything to each other at all, all of them just lying in the dark, breathing.\n\nGus was at the bottom, where he always was.\n\nThe fire went over the top of them and took everything above ground for two miles and did not touch a single animal in the burrow.\n\nThey came out the next morning into a black landscape, and dispersed, and went back to being what they were — which meant that within a week Carson had eaten at least one of the animals who had been down there with him, and this was understood by everybody and did not require discussion.\n\nBut he never touched Gus. Not in nine years. Not in the twenty after.\n\nGus dug the burrow in 1961. Everything that ever lived in it owed him, and Gus never once mentioned it.\n\nThe ones who make room for everybody rarely ask for anything back. Notice them anyway.\n\nGoodnight, eastern indigo snakes. 🌙", "eastern_brown": "Carson had run from everything his whole life, and it had always been the right call, until it wasn't.\n\nHe was fast — one of the fastest snakes in Australia — and his instinct, always, in every situation, was to leave. A shadow, a footstep, a dog barking two paddocks over, and he was gone into the long grass before he had finished thinking about it.\n\nHis mother had taught him this. *Go. Always go. You cannot be bitten if you are not there.*\n\nIt had kept him alive for eleven years.\n\nThe morning the kestrel took Avery, Carson ran.\n\nHe did not decide to. He did not weigh it up. The shadow came over the grass and every muscle in him did what it had done ten thousand times before, and by the time his mind caught up he was forty feet away in the tussock and Avery was in the air.\n\nShe got free. Barely. The kestrel dropped her from twenty feet and she hit the ground badly and it took her three weeks to be able to hunt again, and in all that time she never once said anything about it.\n\nThat was worse.\n\n\"You would not have caught it,\" she said, when he finally made himself ask. \"It was a kestrel. You are a snake. There is nothing you could have done.\"\n\n\"I did not *try*,\" said Carson. \"That is a different thing to not being able.\"\n\nHe thought about it all that summer.\n\nHe did not stop running. Running was still, almost always, correct — and he was not going to pretend otherwise, and he did not become brave, exactly, because he was not built for brave.\n\nBut something in him changed, quietly, so that when the dog came for the nest in November he did not go.\n\nHe stood his ground, all eight feet of him, up off the ground with his neck flat, and the dog — which had never in its life had a brown snake *come toward it* — turned and bolted for the house.\n\nCarson stood in the grass afterward, shaking, and did not feel brave at all.\n\nKnowing when to run is wisdom. Knowing when it is not enough is harder, and it comes later.\n\nGoodnight, eastern brown snakes. 🌙", "eastern_kingsnake": "The copperhead was in the leaf litter and Tilly the box turtle could not get home.\n\nShe had been standing in the same spot for an hour, half-drawn into her shell, and her burrow was on the other side of the log and there was simply no way past.\n\nCarson came through the undergrowth on his way to somewhere else.\n\nHe was an eastern kingsnake. He ate other snakes. He was immune to their venom, and copperheads knew it, and the copperhead — sensing him — left before Carson had even fully arrived.\n\n\"You did not have to do that,\" said Tilly.\n\n\"I did not do anything,\" said Carson honestly. \"It left on its own.\"\n\n\"It left because of you.\"\n\n\"Then you are welcome,\" said Carson, and went on his way, and thought no more about it.\n\nThat was in the spring.\n\nIn the autumn, a hawk got hold of Carson in an open patch of grass — a bad, sudden, terrifying thing, talons in his back, and he twisted and fought and could not get free.\n\nTilly saw it from the trail.\n\nBox turtles are not fast. Box turtles are not brave. Box turtles are, above all, not the sort of animal who runs at a hawk.\n\nTilly ran at the hawk.\n\nShe got there in something like four minutes, which was as fast as she had ever moved in her life, and she was not remotely dangerous, and the hawk was not remotely frightened of her — but she arrived at its feet and hissed and shoved her hard shell into its legs and made an enormous nuisance of herself.\n\nAnd the hawk, irritated and distracted and now with a turtle in the way, let go for half a second.\n\nHalf a second was enough.\n\nCarson made the log.\n\nHe lay inside it for a long time afterward, bleeding and shaking.\n\n\"You did not have to do that,\" he said.\n\n\"I did not do anything,\" said Tilly. \"It left on its own.\"\n\nKindness is not always repaid. But sometimes it is, and by someone you never expected.\n\nGoodnight, eastern kingsnakes. 🌙", "puff_adder": "Milo the meerkat was on sentry duty and he had missed the jackal.\n\nHe was young. He had been watching the sky, the way sentries do, because the sky is where the danger comes from when you are a meerkat — and the jackal had come along the ground, low and slow through the grass, and was now thirty feet from the burrow entrance where six pups were playing in the sun.\n\nMilo saw it and made the wrong sound.\n\nHe made the *hawk* call. It was the one he had practised most. And every meerkat in the clearing did exactly what you do when there is a hawk, which is *look up* and *stay still*.\n\nNobody moved. Nobody ran. Six pups stood in the open, perfectly still, looking at the sky, with a jackal twenty feet away and closing.\n\nCarson had been in the grass for two days and nobody had noticed him, which was, generally, the entire point of being a puff adder.\n\nHe inflated.\n\nThe sound a puff adder makes is not a hiss. It is a deep, enormous, air-brake exhalation — the sound of something very large emptying itself — and it came out of the grass directly in the jackal's path at a range of four feet.\n\nThe jackal went sideways with its legs everywhere and did not stop going.\n\nThe meerkats scattered — properly, this time — into the burrow, all six pups, in about a second and a half.\n\nMilo sat on the mound afterward, alone, shaking, working through the size of what he had almost done.\n\nCarson had not moved at all. He was still exactly where he had been, invisible, in the grass.\n\n\"You were there the whole time,\" said Milo.\n\n\"Two days.\"\n\n\"You could have taken one of the pups.\"\n\n\"I could have,\" Carson agreed. \"I was not hungry. And you were all standing very still, looking at the sky, for no reason at all, and it was the saddest thing I have ever watched.\"\n\nThe one you never noticed may be the one who was paying the most attention.\n\nGoodnight, puff adders. 🌙", "egyptian_cobra": "Carson had a magnificent hood and he knew it, and this was going to be a problem.\n\nFen the fennec fox had made the mistake, three weeks earlier, of saying it was impressive. Since then Carson had spread it approximately four hundred times.\n\nHe spread it at the toads. He spread it at the water. He spread it, on one memorable occasion, at his own reflection, which he claimed afterward was a test.\n\n\"It is a *warning* display,\" said Avery. \"It warns things. It is not decorative.\"\n\n\"It is both.\"\n\n\"It is *one* of those things.\"\n\nFen, who had started all of this and now could not get away from it, watched Carson rear up at a beetle.\n\n\"The beetle does not care,\" said Fen.\n\n\"The beetle is *aware*,\" said Carson.\n\nThe trouble came the night the honey badger arrived.\n\nCarson saw it across the oasis and rose up to his full height and spread his hood in the finest display of his life — enormous, backlit, genuinely magnificent — and held it there, and waited for the honey badger to be appropriately impressed.\n\nHoney badgers are not impressed by anything. Honey badgers are famous for it.\n\nIt came straight at him.\n\nCarson, who had spent three weeks displaying and approximately no time at all thinking about what happens after you display, discovered that he had no plan whatsoever for this and went into the water.\n\nHe stayed there for two hours.\n\nThe honey badger dug up a toad, ate it, and left without ever really acknowledging that Carson had been present.\n\n\"How was the display?\" Avery asked, when he finally came out.\n\n\"The display,\" said Carson, dripping, \"was excellent.\"\n\n\"And the *afterward*?\"\n\nCarson did not answer.\n\nFen laughed so hard he fell over.\n\nA good warning still needs something behind it. Otherwise it is just posing.\n\nGoodnight, Egyptian cobras. 🌙", "tiger_snake": "The water came up in the night and by morning the whole wetland was gone.\n\nNot gone — *changed*. Everything Carson knew about the place had been three feet lower yesterday. The sedge banks he hunted, the log he basked on, the tussock where the frogs called — all under, all silent, all unrecognisable.\n\nAnd Avery was somewhere in it.\n\nShe had been in the far reed bed when the rain started. That was thirty hours ago.\n\nCarson went into the water.\n\nHe was a good swimmer — tiger snakes are, better than almost any other Australian snake — and he could hold his breath for minutes at a time, and none of that helped very much when the entire landscape had turned into one enormous grey sheet with nothing to navigate by.\n\nHe swam for six hours.\n\nHe got to the far reed bed and it was not there. There was no reed bed. There was open water where the reed bed had been and Carson floated in the middle of it in the rain, entirely alone, with nothing at all to go on.\n\nHe kept going anyway.\n\nHe found her on a floating raft of torn-up reed a half mile downstream, cold and exhausted and unable to swim any further, and he did not say anything at all when he got there because there was nothing to say.\n\nThey lay on the raft together for two days while the water went down.\n\nShe could not hunt. He hunted for both of them — badly, in flooded water, catching almost nothing — and they were both starving by the time the sedge banks came back up out of the water and the frogs started again.\n\n\"You should not have come,\" she said, on the second night.\n\n\"I know.\"\n\n\"You could have drowned. You nearly did.\"\n\n\"I know,\" said Carson.\n\nShe did not say anything else about it, then or ever.\n\nSome things you do not do because they are sensible. You do them because of who you would be if you didn't.\n\nGoodnight, tiger snakes. 🌙", "sea_krait": "Carson could hold his breath for two hours, and the eel was in a hole that would take three.\n\nHe knew this. He had done the arithmetic. He had been hunting this reef for six years and he understood, better than almost anything, exactly what his own limits were.\n\nThe eel was very large. It was wedged deep in a coral crevice and it was not coming out and Carson would have to go all the way in after it, and the going in was the easy part.\n\n\"You will not make it back up,\" said Avery, from the surface.\n\n\"I will.\"\n\n\"You have two hours. That hole is deep.\"\n\nCarson went down.\n\nThe first hour was fine. He worked into the crevice, foot by foot, through coral that scraped his scales raw, and got a grip on the eel and began the long ugly business of getting it out.\n\nThe second hour was not fine.\n\nHe got the eel free at ninety minutes. He was fifteen feet inside a coral wall, upside down, and he began to back out, and the eel — thrashing — jammed itself and him together in the narrowest part of the crevice.\n\nAt a hundred and ten minutes he understood that he was going to have to make a choice.\n\nHe let the eel go.\n\nHe backed out empty-mouthed, and swam for the surface with his chest burning and the light going grey at the edges, and he broke into the air at a hundred and thirty-one minutes and lay on the water gasping and utterly, completely empty-handed.\n\nHe got up onto the island rock and lay in the sun for an hour before he could speak.\n\n\"You could have had it,\" said Avery. \"At ninety minutes. If you had held on.\"\n\n\"Yes,\" said Carson.\n\n\"You would probably have made it.\"\n\n\"*Probably*,\" said Carson. \"That is the word. It was a very good eel, and I wanted it badly, and I have wanted things badly before and it has never once made the water hold more air.\"\n\nHe ate a small fish that evening and it was not enough and he did not complain about it.\n\nWanting something very much does not change what is possible. Let go early. Let go while you still can.\n\nGoodnight, sea kraits. 🌙", "fer_de_lance": "Diego had been bitten once, eleven years ago, and had not been back into the forest at night since.\n\nHe did the daytime surveys. He wrote the papers. He trained the students and told them, every single year, exactly where to put their feet and exactly what to carry and exactly how fast the antivenom needed to get there, and he had not walked a night transect in over a decade.\n\nHis hand still did not close properly. He did not talk about it.\n\nThe new student, Coco, was doing her first night survey and she was three hours overdue.\n\nDiego stood at the trailhead for a long time.\n\nThen he took the light and went in.\n\nThe forest at night is a different animal entirely. Every root is a snake. Every leaf shifting in the dark is a snake. His heart was going before he made a hundred metres and he made himself keep walking, one foot and then the next, down a trail he knew perfectly well in the daylight and did not know at all now.\n\nHe found Coco at 2 a.m. She had gone off-trail, and turned her ankle, and had been sitting against a tree for five hours with a dead torch, absolutely terrified and doing exactly the right thing by not moving.\n\nHe got her up. He got her arm over his shoulder.\n\nAnd they walked out, slowly, over four hours, and Diego's light went across the leaf litter over and over and over.\n\nTwice it crossed a fer-de-lance.\n\nThe first was six feet off the trail. It did not move. Carson was in a coil under a buttress root, patient and enormous, and the light went across him and away, and he stayed exactly where he was, because there was nothing here that concerned him.\n\nThe second was closer.\n\nDiego saw it. He stopped. He went around, wide, the way he had told a hundred students to do it, and his hands were shaking and he went around anyway.\n\nThey came out at dawn.\n\nCoco never knew how many there had been. Diego never told her.\n\nHe walked the night transect again the following week. And the week after that.\n\nCourage is not the absence of the thing that frightened you. It is walking past it, twice, with somebody leaning on your shoulder.\n\nGoodnight, fer-de-lance. 🌙", "corn_snake": "The girl who screamed at Carson in the grain shed was eight years old.\n\nShe had come around the sacks with a torch and found four feet of orange-and-red snake and she had screamed the barn down, and Rosa had come running, and there had been a great deal of noise and Carson had gone under the floorboards and stayed there for two days.\n\n\"Corn snake,\" Rosa had told her, afterward. \"Harmless. He keeps the mice out of the grain. He is one of the good ones.\"\n\nEllie had not been convinced. Ellie had been eight.\n\nBut she came back the next summer, and the summer after, and each year Rosa would say *there he is* and point at the coils among the sacks, and each year Ellie looked a little longer before she stepped back.\n\nBy eleven she could stand in the shed while he was in it.\n\nBy thirteen she was the one telling *other* children that he was harmless.\n\nAt nineteen she was a biology student, and at twenty-four she was working for the state, and at twenty-nine she was standing in front of a county planning board arguing that the proposed development on the old Halloran farm needed to go around the pine hammock rather than through it, because it was some of the last decent habitat in the county for a whole list of species, and one of the species on the list was *Pantherophis guttatus*.\n\nShe won by one vote.\n\nRosa had died four years earlier. The barn was gone. Carson had been gone longer than that — corn snakes do not live thirty years — and somewhere in the pine hammock beyond the old fence line there were snakes who were probably his great-great-grandchildren and who had never heard of him and never would.\n\nEllie thought about that for a long time afterward, in the car, in the dark.\n\nThe eight-year-old who screamed had grown up into the woman who saved the ground.\n\nYou never know which frightened child is going to grow into the person who protects you. Be patient with them.\n\nGoodnight, corn snakes. 🌙", "green_mamba": "Carson was in the wrong tree and there was no way down.\n\nHe had come across on a branch that had broken behind him — an ordinary, stupid, entirely avoidable accident — and now he was in an isolated fig, thirty feet up, with open ground in every direction and a martial eagle that had been circling the clearing for the last half hour.\n\nHe could not fly. He could not jump. He was a green mamba and he was, in a green tree, effectively invisible, and this was the only thing keeping him alive and it was going to stop working the second he moved.\n\nThe eagle knew he was in there. It had watched the branch break.\n\nSo it circled. And Carson lay along a limb in the leaves, not moving at all, and the two of them waited each other out for four hours.\n\nCarson lost. He always would. He was going to have to move eventually and they both knew it.\n\nThen a troop of colobus monkeys came into the clearing.\n\nThey were noisy and disorganised and there were twenty of them and they came up into the fig tree with no interest in anything except the fruit, and the entire canopy came alive — leaves everywhere, branches thrashing, twenty large animals moving in twenty directions at once.\n\nCarson went down the trunk in the middle of it.\n\nThe eagle stooped — and hit a branch that a colobus had just released, and pulled up hard, and by the time it had turned Carson was in the undergrowth and gone.\n\nMomo the colobus, who never knew he had been part of anything, ate a fig.\n\nAvery found Carson in the thicket an hour later.\n\n\"How did you get out?\"\n\n\"Noise,\" said Carson. \"Somebody else's.\"\n\nHe thought about it for a long time that night.\n\n*I did nothing. I was simply there when the chaos arrived, and ready to use it.*\n\nWait for your moment, and be ready when somebody else makes it for you.\n\nGoodnight, green mambas. 🌙", "death_adder": "The death adder does not move.\n\nThis is the entire strategy. You bury yourself in the leaf litter, you wiggle your tail like a worm, and you wait for the world to come to you. Carson had done it his whole life and it had never once failed him.\n\nThe bushfire came through in October.\n\nEverything above ground burned. The leaf litter went. The bandicoots went, or ran, or died. The whole understory that Carson had lived in for eleven years was a black flat nothing, ankle-deep in ash, from the ridge to the creek.\n\nHe survived by going down a wombat hole.\n\nHe came out three days later into a landscape with no cover at all — no leaves, no litter, nothing to bury himself in, nowhere to be invisible.\n\nAnd he did what he had always done. He found a spot, and he lay in it, and he wiggled his tail.\n\nOn black ash. In the open. Visible from two hundred metres.\n\nHe did this for nine days.\n\nNothing came. Nothing was *going* to come — there was no prey left, and he was not hidden, and he was going to lie there being an obvious black-and-brown snake on a black-and-grey plain until a kookaburra noticed him.\n\nAvery came up from the creek gully on the ninth day.\n\n\"There is regrowth by the water,\" she said. \"The frogs came back.\"\n\n\"I am set up here.\"\n\n\"You are set up on *ash*,\" said Avery. \"Carson. It is not an ambush if there is nothing to ambush and everything can see you.\"\n\nHe did not want to hear it. He had never had to change anything in his life. He was very, very good at exactly one thing, and being good at one thing for eleven years does something to your ability to consider that you might have to do a second.\n\nHe went to the creek on the eleventh day, and it was better, and he ate.\n\nHe hated it. He hated every part of learning it.\n\nBeing extremely good at one thing is not the same as being right. The world can change underneath your best trick.\n\nGoodnight, death adders. 🌙", "rhino_viper": "The otter pup went into the current sideways and did not come up where it should have.\n\nOllie had been teaching it to swim in the slow water by the bank — where the river bent and eddied and it was safe — and a branch had come down out of the main channel and the pup had bolted the wrong way, into the fast water, and was now forty feet downstream and going under.\n\nOllie went after it. Ollie was a strong swimmer. Ollie was also going to be, in about eleven seconds, an otter in a stretch of white water that had killed adults.\n\nCarson was on the bank.\n\nHe was a rhinoceros viper. He was not built for this in any way whatsoever. He was a heavy, slow, ambush-hunting snake who lived in the leaf litter and who could swim adequately and not one bit more than adequately.\n\nHe went in anyway.\n\nHe got below them — that was the only thing he could do, get below them, into the shallows at the bottom of the run where the river spread out over gravel — and he braced himself across a gap between two rocks and made himself into a bar.\n\nA four-foot, extremely colourful, extremely uncomfortable bar.\n\nThe pup hit him at speed and stopped.\n\nOllie came down two seconds later and grabbed it and got a foothold on the gravel and hauled it up onto the rock, and the two of them lay there coughing and shaking while Carson, still wedged between the rocks with a great deal of the river going over his head, extracted himself with as much dignity as the situation allowed.\n\nWhich was none.\n\nHe got onto the bank and lay in the sun, cut, exhausted, and thoroughly out of his depth in every sense.\n\n\"You are not a river snake,\" said Ollie.\n\n\"I am aware.\"\n\n\"You could have drowned.\"\n\n\"I am *aware*,\" said Carson.\n\nHe went back to the leaf litter that evening and stayed there for a week.\n\nYou do not have to be built for it. You only have to be there and willing.\n\nGoodnight, rhinoceros vipers. 🌙", "rough_green_snake": "The butterfly would not leave.\n\nIt had landed on Carson's back at some point during the morning — he had not noticed exactly when — and it had been sitting there ever since, opening and closing its wings in the sun, entirely at home, showing no sign whatsoever of moving on.\n\nCarson was hunting.\n\nYou cannot hunt with a butterfly on your back. Or rather, you can, but every cricket in the vine tangle can see a large orange flag moving through the leaves and they had all, without exception, decided to be somewhere else.\n\n\"Shoo,\" said Carson.\n\nThe butterfly did not shoo.\n\nHe moved along the branch. The butterfly rode along. He went upside down under a vine, which he had rather thought would settle it. The butterfly hung on, upside down, and appeared to be enjoying itself.\n\nAndy the anole lizard was watching from a leaf and having the time of his life.\n\n\"You have a passenger,\" said Andy.\n\n\"I have noticed.\"\n\n\"It suits you.\"\n\n\"Andy,\" said Carson, \"I have not eaten since yesterday and there is a cricket eleven inches away and it has been watching this *entire performance*.\"\n\nHe struck at the cricket. He missed by a foot, because you cannot get a clean line on anything with a butterfly disrupting your balance.\n\nAvery arrived, took in the situation, and said nothing at all, which was worse than anything she could have said.\n\nThe butterfly stayed for four hours.\n\nWhen it finally left — drifting off into the honeysuckle without a backward glance — Carson lay perfectly still on the branch for a full minute.\n\n\"Do not,\" he said.\n\n\"I did not say anything,\" said Avery.\n\n\"You were *going* to.\"\n\nHe ate three crickets in the following ten minutes, which rather proved his point about the butterfly, and he was insufferable about it for the rest of the week.\n\nSome problems cannot be solved. Some problems have to be waited out. Some problems are butterflies.\n\nGoodnight, rough green snakes. 🌙", "massasauga": "The road had not been there when Carson was born.\n\nIt went straight through the middle of everything — the wet meadow on one side, the hibernaculum on the other — and every autumn every massasauga in the marsh had to get across it, and every autumn fewer of them made it.\n\nCarson had crossed it eleven times. He was small and slow and the rattle he had was so quiet it sounded like an insect, and none of that helped at all with a road.\n\nHe went at dusk, in the rain, because the rain kept the traffic down.\n\nIt took him forty minutes to work up to it. He lay in the grass at the verge and the trucks went past two feet from his head and every single one of them shook the ground and every single one of them was a thing he could not fight or hide from or warn.\n\nThen a gap.\n\nHe went.\n\nHe was eleven feet out — halfway, on the centre line, in the open — when the headlights came around the bend.\n\nHe did the only thing his body knew how to do. He coiled and rattled — that tiny, buzzing, insect-quiet rattle, aimed at a two-ton truck, the most useless warning in the history of warnings — because there was nothing else in him to give.\n\nThe truck went past. It missed him by a foot.\n\nHe was still coiled and still rattling twenty seconds later.\n\nHe got to the other side and into the grass and he shook for a very long time.\n\nAvery came across ten minutes later, in the next gap, and found him there.\n\nThey went up to the hibernaculum together in the dark.\n\nSam the biologist counted forty-one massasaugas at that den in the autumn. She had counted seventy-eight when she started the survey nine years earlier. She wrote both numbers down and sat in her truck at the trailhead for a while before she drove home.\n\nNot everything can be survived by being careful. Some things have to be changed by somebody else.\n\nGoodnight, massasaugas. 🌙", "marmot": "Milo had the worst job in the colony and he had stopped taking it seriously.\n\nHe was an alpine marmot, and the job was sentry — sitting up on the boulder above the burrows while everyone else fed, watching the sky and the ridge, and whistling the alarm if anything came. It was boring. Nothing ever came. Milo had sat sentry a hundred times and whistled maybe twice, and he had begun to spend his watches half-dozing in the sun.\n\nThe old marmot, Vess, warned him. \"You are not watching.\"\n\n\"Nothing ever comes.\"\n\n\"Nothing ever comes *because someone is watching*,\" said Vess. \"That is the whole point. The day you stop watching is the day it comes.\"\n\nMilo did not really believe her.\n\nHe was on the boulder the afternoon the golden eagle came, and he was, as usual, half-asleep in the warm sun, and he did not see it drop out of the high blue until it was already committed — folding its wings, falling out of the sky toward a colony of marmots feeding in the open with a sentry who was not watching.\n\nMilo saw it a half-second late.\n\nHe whistled — the alarm, sharp and piercing — and it was late, it was almost too late, but it was not quite too late, and the colony scattered for the burrows in a single panicked instant as the eagle came down.\n\nIt caught nothing. Barely. The nearest marmot made the burrow mouth with the eagle's talons a body-length behind.\n\nMilo sat on the boulder afterward, wide awake now, shaking, understanding exactly how close his dozing had come to costing a life.\n\nHe never dozed on watch again.\n\n\"You whistled late,\" said Vess.\n\n\"I nearly whistled too late.\"\n\n\"Yes,\" said Vess. \"The job is boring until the one moment it is the most important job in the world. You do not get to know which watch that will be. So you watch them all.\"\n\nThe dull duty nobody thanks you for is holding up more than you know. Do it like it matters, because one day it will.\n\nGoodnight, alpine marmots. 🌙", "mountain_hawk_eagle": "The pheasant went into the thickest part of the forest and Hawk had to decide how badly he wanted it.\n\nHe was a mountain hawk-eagle — powerful, broad-winged, a hunter of the steep forested mountains — and most eagles hunt the open sky, where there is room to stoop and room to turn. Hawk hunted the forest, where there was neither, and it made him one of the most skilled fliers of any eagle alive.\n\nThe pheasant was fast and it knew the forest, and when Hawk came for it, it did the one thing that should have saved it: it flew into the dense canopy, into the tangle of branches and trunks where a large eagle could not follow without breaking a wing.\n\nMost eagles would have pulled up. The reward was one pheasant. The risk was flying full-speed through a maze of solid wood.\n\nHawk went in.\n\nNot recklessly — that was the thing. He did not simply crash in after it. He read the canopy as he flew, folding his great wings half-shut to fit the gaps, twisting through the branches, choosing his line a heartbeat ahead, matching the pheasant's every turn through a three-dimensional maze at killing speed.\n\nBranches whipped past inches from his wingtips. One wrong read, one branch misjudged, and he would break himself against a trunk and die on the forest floor.\n\nHe did not misjudge. He had spent his whole life learning this exact thing — the forest that other eagles feared was the forest he had made himself the master of — and he ran the pheasant down through the canopy, turn for turn, and caught it in a tunnel of branches where no open-sky eagle could ever have gone.\n\nHe carried it out to a high branch and ate it in the last of the light.\n\nThe forest that stopped every other eagle was the one that fed him, because he had done the long work of learning the thing that frightened them.\n\nThe skill that others avoid learning is the one that will feed you where they cannot go. Do the hard practice.\n\nGoodnight, mountain hawk-eagles. 🌙", "green_sea_turtle": "Tula had to reach the beach where she was born and it was a thousand miles away.\n\nShe was a green sea turtle, and she was carrying eggs, and the eggs could only be laid on one beach in all the world — the same beach where she had hatched, thirty years before, and scrambled down to the sea as a hatchling the size of a bottle cap. Something in her had remembered it for thirty years. Now it was pulling her back.\n\nA thousand miles of open ocean lay between her and that beach.\n\nShe swam. Green turtles navigate by the earth's magnetic field, a sense written into them, and Tula followed it across the empty blue for weeks — through currents that pushed her off course, through storms that churned the surface, past the tiger sharks that follow the turtle roads waiting for the tired and the slow.\n\nShe did not stop. She could not stop. The eggs would not wait, and the beach was the only place in the world they could go.\n\nA current caught her halfway and swept her a hundred miles off her line. She felt the magnetic pull go wrong — the map inside her telling her she was in the wrong place — and she turned into the current and fought back across it, days of hard swimming just to undo what the water had done in one afternoon.\n\nShe reached the nesting waters exhausted, thinner than when she started, and she waited offshore for night.\n\nThen she did the hardest thing of all: she left the sea. She hauled her great body up the sand — where she was slow, and heavy, and helpless, where the ocean's grace became a lumbering crawl — and she dug her nest above the tide line and laid her eggs in it, exactly where her own mother had laid her, on the one beach in all the world.\n\nThen she covered them, and turned, and dragged herself back down to the sea, and was gone.\n\nSome things pull you across the whole world to one small place, and there is nothing to do but go. Follow the map inside you.\n\nGoodnight, green sea turtles. 🌙", "manta_ray": "Little Mira was covered in parasites and too proud to hold still.\n\nShe was a young manta ray — enormous already, a wingspan wider than she was old, gliding through the blue on wings of muscle — and she was itching, all over, with the tiny parasites and dead skin that build up on anything that lives in the sea. She did not know what to do about it. She only knew she was miserable.\n\nAn old manta named Vex found her thrashing, trying to scrape herself on a rock.\n\n\"You will hurt yourself doing that,\" said Vex. \"Come to the cleaning station.\"\n\n\"The what?\"\n\nVex led her to a particular coral head on the reef — an ordinary-looking spot, except that it was busy with small wrasse, little cleaner fish that lived there. \"You hold still,\" said Vex, \"above the coral. And you let them work.\"\n\n\"Hold still? While small fish swim all over me?\"\n\n\"That is exactly it.\"\n\nMira did not like it. Every instinct told her that holding still while things swarmed over her was wrong, was dangerous, was the opposite of what a fast strong manta should do. She wanted to *do* something about the itching, not float there and be swum on.\n\nBut she was miserable, and Vex was patient, and finally Mira glided over the coral head and made herself stop.\n\nAnd the cleaner wrasse came. Dozens of them, swarming over her huge dark wings, into her gills, across her back — eating the parasites, the dead skin, every itching thing — and it did not hurt at all. It was the opposite of hurting. She hung in the water above the coral and felt, patch by patch, the misery lifting off her.\n\nShe had to do nothing. That was the whole trick. The one thing she had been unwilling to do — hold still and let herself be helped — was the only thing that worked.\n\nShe came back to the cleaning station every few days for the rest of her life.\n\nSometimes the answer is not to do more. It is to hold still and let others help you.\n\nGoodnight, manta rays. 🌙", "giant_octopus": "Occa was cornered by a wolf eel and she had to get out through a gap the size of a coin.\n\nShe was a giant Pacific octopus — enormous, eight arms spanning wider than a person is tall — and she had been out hunting on the reef when the wolf eel found her, a big one, all teeth and muscle, faster in a straight line than she was.\n\nShe could not outswim it. She jetted for her den, but the eel was between her and it now, and she was pressed back against a rock wall with the eel closing.\n\nShe had one thing eels do not have: she had no bones.\n\nHer whole enormous body — every part of her except her hard beak — could squeeze through any gap her beak could fit through. And there was a crack in the rock wall behind her, a thin crack, no wider than a coin.\n\nThe eel lunged.\n\nOcca poured herself into the crack. It should have been impossible — an animal that size, into a gap that small — but she had no skeleton to stop her, and she squeezed her whole body through, arm by arm, flattening and folding and streaming through the coin-sized gap while the eel's teeth snapped shut on the water where she had been.\n\nShe came out the other side into a hollow in the rock, and she was not done. She changed color — her skin flushing to match the rock exactly, every bump and shadow — and she went still, and she released a cloud of dark ink into the water behind her to confuse the trail.\n\nThe eel forced its head into the crack and found nothing it could reach. It could not follow. It could not find her against the rock. It gave up and swam away.\n\nOcca stayed folded in the hollow, invisible, until she was sure, and then she jetted home.\n\nShe had no bones, no shell, no speed. What she had was every other trick in the ocean — the squeeze, the color, the ink — and she had used all of them at once.\n\nWhen you cannot win by strength, win by having more ways out than they have ways in.\n\nGoodnight, giant octopuses. 🌙", "bio_jellyfish": "Jelly's light was the only thing that saved the little fish, and she never even knew she had done it.\n\nShe was a bioluminescent jellyfish — drifting in the deep dark, her body able to flush with cold blue-green light, glowing and pulsing through the black water. She did not glow on purpose, exactly. It was simply what she was, part of her, a light she carried through the dark.\n\nA small fish, lost in the deep, was in trouble. It had drifted down too far, into the crushing dark where it did not belong, and it could not find its way back up, and there was no light anywhere to orient by — just endless black in every direction, no up, no down, no way to know which way was the surface and safety.\n\nIt was going to die down there, disoriented, simply because it could not tell which way was up.\n\nAnd then Jelly drifted past, glowing.\n\nHer light — that cold blue pulse — was the only thing in all that darkness, and the little fish, desperate, swam toward it. And Jelly, drifting slowly upward as jellyfish do, rising through the water on her slow pulses, became a light to follow — a moving glow ascending through the black, and the fish followed it up, and up, out of the deep dark, toward the faint gray that meant the surface, toward the water where it belonged.\n\nJelly did nothing. She simply drifted upward, glowing, as she always did. She did not know the fish was there. She did not know it was following. She did not know she was leading it out of the deep and back to life.\n\nShe was just being what she was — a light in the dark — and that was enough to save something, without her ever knowing.\n\nThe little fish reached the shallows and lived. Jelly drifted on, glowing, unaware, having been someone's only light in the darkest place there is.\n\nSometimes just being what you are — a light in someone's dark — saves them, even when you never know you did it.\n\nGoodnight, jellyfish. 🌙", "barn_owl": "Ollie hunted in total silence and one night the silence was the only thing that fed him.\n\nHe was a barn owl, and his feathers were made for silence — soft-edged, sound-swallowing, so that he flew without a whisper. On a good night this let him drop on a mouse before it heard a thing. But this was not a good night: the field was frozen hard, the mice were deep under the snow, and Ollie had hunted for hours with nothing.\n\nHe could not see the mice under the snow. But a barn owl does not hunt by sight in the dark — he hunts by sound, his hearing so precise he can pinpoint a mouse's heartbeat beneath a foot of snow, one ear set higher than the other so he can place a sound in three dimensions.\n\nHe quartered the field in silence, listening. Nothing. Nothing. Then — the faintest rustle, deep under the snow, a mouse moving in its tunnel.\n\nHe turned, locked onto it with both ears, hovering in absolute silence so his own flight made no sound to drown it out. He placed it exactly. And he dropped — silent all the way down, plunging through the snow crust talons-first onto a mouse that never heard death coming.\n\nHe caught three more that way before dawn, each one located by sound alone, each one taken in perfect silence. On a night when there was nothing to see, his silence and his hearing were everything.\n\nWhen you cannot see what you need, go quiet and listen. Silence is what lets you hear the thing that saves you.\n\nGoodnight, barn owls. 🌙", "red_fox": "Rusty heard the mouse under the snow and had to trust a sense he could not see.\n\nHe was a red fox, and winter had locked the forest under deep snow, and the mice he lived on were tunneling somewhere beneath it, invisible. He was hungry, and there was nothing to see, nothing to smell strongly enough, nothing but white snow in every direction.\n\nBut a fox hunting in snow has a strange gift: he can hear the mice beneath it, and — some say — sense the very direction of the earth's field, lining up his pounce with an accuracy that seems like magic. Rusty stood still, ears forward, listening into the snow.\n\nA rustle. Faint. A mouse moving in its tunnel, a foot down, invisible.\n\nEverything in him wanted to see it first, to be sure. But there was nothing to see. He had to trust the sound alone — locate the mouse by ear, commit to a spot he could not verify, and leap blind.\n\nHe crouched, aimed at the sound, and leapt — high, arcing, diving down head-first through the snow crust onto a spot where his ears said a mouse was and his eyes could confirm nothing.\n\nHe came up with the mouse.\n\nHe did it again through the long cold day, each pounce a leap of faith onto a sound beneath the snow, trusting a sense that gave him no picture, only a direction. And it fed him, on a day when seeing would have starved him.\n\nWhen there is nothing to see, you have to trust the sense that does not show you a picture. Aim at what you can only hear, and leap.\n\nGoodnight, red foxes. 🌙", "brown_bear": "Bruno gorged himself sick all autumn and a young bear thought he had lost his mind.\n\nHe was a brown bear, and autumn had come, and Bruno was eating with a desperation that looked like madness — cramming down berries, roots, fish, insects, anything, all day, far more than any bear could need, eating until he could barely move and then eating more.\n\nA young bear named Pip watched him strip a whole berry patch. \"Why do you eat so much? You are already fat. You cannot possibly be hungry. You will make yourself sick.\"\n\n\"I am eating the winter,\" said Bruno.\n\nPip did not understand.\n\n\"In a few weeks,\" said Bruno, \"the snow comes, and the food ends, and I go into my den and I sleep for months. Nothing to eat the whole winter. Everything I need to survive those months, I have to eat *now*, and carry as fat, and live on while I sleep. So yes — I eat until I am sick, and then I eat more, because every mouthful now is a day of winter survived later.\"\n\n\"So the fat is not greed.\"\n\n\"The fat is the whole plan,\" said Bruno. \"A bear that goes thin into winter does not come out. The gorging looks like madness in autumn. In February, asleep in the snow with nothing to eat, it is the only reason I am alive.\"\n\nPip began to eat in earnest too, and went into winter fat, and woke in spring thin but alive — because he had spent the autumn stuffing away the season to come.\n\nPrepare for the hard season while the food is here, even past the point that feels reasonable. What looks like too much now may be exactly enough later.\n\nGoodnight, brown bears. 🌙", "panther_chameleon": "Cham changed his colors to say what he could not shout across the branches.\n\nHe was a panther chameleon — able to shift his skin through brilliant blues, reds, greens, and golds — and a young chameleon, Pip, thought the colors were only for hiding.\n\n\"You use your colors to blend in,\" said Pip. \"To disappear into the leaves.\"\n\n\"Sometimes,\" said Cham. \"But mostly, my colors are how I *speak*.\"\n\nPip did not understand.\n\nA rival male came along the branch that morning — bright, aggressive, colors flaring, challenging Cham for the territory. And Cham did not fight, not yet. He *answered* — his skin flushing brilliant, bold colors, a display that said, without a single movement, *this is mine, I am strong, do not test me.* The two chameleons faced each other, blazing colors back and forth, a whole argument conducted in light.\n\nAnd the rival, reading Cham's colors — the confidence in them, the strength — backed down and left, without a single bite exchanged.\n\n\"You see,\" said Cham. \"The colors said everything. He read that I was strong and unafraid, and he chose not to fight a fight he would lose. If I had stayed dull and hidden, he would not have known — he might have fought, and one of us would have been hurt. The colors let us settle it without blood.\"\n\n\"So the colors are a language.\"\n\n\"The colors are how I say what I am,\" said Cham. \"Fear, anger, strength, calm — all of it, in light, for anyone who can read it. Hiding is the smallest thing they do.\"\n\nPip watched his own skin flush with color, and began to learn to say things with it.\n\nHow you present yourself is a language. Show your strength and your feeling clearly, and you can often settle things without a fight.\n\nGoodnight, panther chameleons. 🌙", "saltwater_crocodile": "Sal waited eleven months for one crossing and a young croc could not stand it.\n\nHe was a saltwater crocodile — the largest reptile alive, an ambush hunter of the mangrove rivers — and he had chosen his spot at the crossing where the wildebeest-like herds came down to drink, and he had waited. And waited. Through the long dry season, submerged, still, patient beyond anything.\n\nA young crocodile, Pip, was maddened by it. \"You have been at this crossing for months. Nothing comes. How do you just *wait* like that? I cannot stand it.\"\n\n\"I wait,\" said Sal, \"because the crossing is where they must come, eventually. Not today. Maybe not this month. But the herds will come to this water, because it is the only water, and when they do, I will be exactly here, and I will not have to chase anything. The waiting is the hunt.\"\n\n\"But you might wait forever.\"\n\n\"I might wait a year,\" said Sal. \"A crocodile can. I do not need to eat often — one big meal lasts me. So I can afford to wait for the great moment that a hungrier, more impatient hunter cannot. My patience is my whole strength. I can outwait anything.\"\n\nPip could not do it — kept moving, kept chasing small prey, kept burning energy on hunts that half-failed.\n\nAnd then the herds came to the crossing, the way Sal had always known they would, and Sal — exactly where he had waited for eleven months — took a huge animal in one explosive strike, and ate enough to last for months.\n\nExtraordinary patience is a strength that impatient hunters cannot match. If you can outwait everyone, the great moment eventually comes to you.\n\nGoodnight, saltwater crocodiles. 🌙", "spoonbill": "Spoon fed with her eyes closed in the muddy water and a young bird thought she was doing it wrong.\n\nShe was a roseate spoonbill — pink, with a strange flat spoon-shaped bill — and she fed by sweeping that bill side to side through the murky mangrove shallows, mouth open, eyes not even looking down. A young spoonbill watched, confused.\n\n\"You are not even looking,\" said the young bird. \"You just swing your bill through the mud with your eyes anywhere but the water. How can you catch anything you cannot see?\"\n\n\"I do not need to see it,\" said Spoon. \"The water here is too muddy to see through anyway. Looking would tell me nothing.\"\n\nSpoon swept her bill through the murk — and it was lined with sensitive nerves, so that the instant a small fish or shrimp touched the inside of the spoon, the bill snapped shut on it by feel, faster than sight could ever manage. She did not hunt by looking. She hunted by *touch*, sweeping through water too cloudy for eyes to work in at all.\n\n\"The water is mud,\" said Spoon. \"A bird that hunts by sight would starve here — there is nothing to see. So I gave up on seeing. I feel for my food instead. My bill catches what my eyes never could, in water where eyes are worthless.\"\n\nThe young spoonbill tried to hunt by sight, peering into the murk, and caught nothing. Then it tried Spoon's way — sweeping, eyes forgotten, feeling — and its bill snapped shut on a shrimp it had never seen.\n\nWhen the usual way of sensing the world fails — when the water is too murky to see — find another sense that works. Do not insist on seeing where seeing is useless.\n\nGoodnight, spoonbills. 🌙", "sea_krait_mangrove": "Kai lived between sea and land and a young snake thought he belonged to neither.\n\nHe was a yellow-lipped sea krait — a banded sea snake that hunted eels in the ocean but returned to land to rest, digest, and lay eggs. A young krait, Pip, was troubled by it.\n\n\"The sea snakes think we're half land creatures,\" said Pip. \"The land snakes think we're sea creatures. We belong to neither. We're always leaving one place for the other. Where do we actually belong?\"\n\n\"We belong to both,\" said Kai. \"And that is not a smaller thing than belonging to one. It is a larger one.\"\n\nKai hunted in the sea — sliding through the coral, catching eels in the crevices, holding his breath in the deep — and then he came ashore, onto the warm rocks, to rest and digest in a way he could not do in the water, and to lay his eggs on land where the sea could not reach them.\n\n\"The pure sea snakes cannot leave the water,\" said Kai. \"The land snakes cannot enter the deep sea. But I can do both. I hunt where the sea snakes hunt, and I rest and breed where the land gives me what the sea cannot. I am not stuck between two worlds. I have *two* worlds, and I take the best of each.\"\n\n\"But we never fully settle in either.\"\n\n\"No,\" said Kai. \"We move between them, all our lives. And that movement is not homelessness. It is having twice as much home as anyone who can only live in one place. Do not mourn belonging to neither. We belong to both.\"\n\nPip slid from the warm rock down into the sea, and back, and began to feel it — not as being lost between two worlds, but as having two.\n\nBelonging to two worlds is not belonging to none. It can mean having twice as much, and taking the best of each. Do not mourn the in-between.\n\nGoodnight, sea kraits. 🌙", "great_white": "Whitey had to keep swimming his whole life and a young shark thought it was a curse.\n\nHe was a great white shark, and a young shark, Pip, made a troubling discovery.\n\n\"We can never stop,\" said Pip, alarmed. \"Not ever. If I stop swimming, I can't breathe — the water stops flowing over my gills and I start to sink and suffocate. We have to swim forever, even in our sleep. That's a curse. Everything else gets to rest.\"\n\n\"It is not a curse,\" said Whitey. \"It is the reason we rule the sea.\"\n\n\"How is never resting a good thing?\"\n\n\"Because it means we are *always moving*,\" said Whitey. \"Always hunting, always covering the ocean, always ready. The fish that rest must find a safe place to hide and stop, and they are vulnerable when they do. We are never vulnerable that way, because we are never stopped. We swim through our whole lives — through sleep, through everything — and it makes us the most tireless hunters in the sea. There is nowhere in the ocean we cannot be, because we never have to stop and hide anywhere.\"\n\n\"But don't you get tired?\"\n\n\"We are built for it,\" said Whitey. \"Every part of us is made to move endlessly, easily, forever. What would exhaust anything else is simply what we are. The thing you call a curse is the thing that makes us unstoppable.\"\n\nPip swam on, through the endless blue, and began to feel it not as a sentence but as a kind of freedom — to belong to the whole ocean, always moving, never having to stop and hide.\n\nWhat feels like a limitation you can never escape may be the very thing that makes you strong. The constant motion is the power.\n\nGoodnight, great white sharks. 🌙", "humpback_whale": "Hump sang across a thousand miles of ocean to reach the others of her kind.\n\nShe was a humpback whale, and she was alone in a vast and empty sea, the nearest other humpback hundreds of miles away, out of sight in the endless blue. A young whale, Pip, despaired of the loneliness.\n\n\"The ocean is so big and empty,\" said Pip. \"The others are so far away. We can't see them. How do we ever find each other out here? How are we not just alone forever?\"\n\n\"We sing,\" said Hump.\n\nAnd Hump began to sing — a long, complex, haunting song, low notes that traveled through the water in a way that light and sight never could. Sound carries astonishingly far in the sea, and a humpback's song can cross hundreds, even thousands of miles of ocean, reaching other whales far beyond the horizon.\n\n\"The ocean is too big to see across,\" said Hump. \"But it is not too big to *hear* across. My song travels farther than I could ever swim, farther than I could ever see. Other humpbacks, hundreds of miles away, hear it — and they sing back, and we find each other across a sea far too vast for eyes. We are never truly alone, however empty it looks, because our voices reach where nothing else can.\"\n\nPip listened — and faint, from impossibly far away, another whale's song came back through the water. Not alone. Never alone. Just far apart, and connected by sound across the whole vast ocean.\n\nPip began, softly, to sing.\n\nHowever vast and empty things seem, your voice can reach farther than your eyes. Call out — you are more connected than the distance makes it look.\n\nGoodnight, humpback whales. 🌙", "poison_dart_frog": "Dart was tiny and bright and utterly unafraid, and a young frog could not understand it.\n\nShe was a poison dart frog — one of the most toxic creatures in the rainforest, and one of the most brilliantly colored: electric blue, or blazing orange, or vivid gold. A young
